# One service. PostgreSQL carries relational data, JSONB documents and vectors,
# so AMOS needs exactly one stateful system rather than three (ADR-001).
#
# Works with `docker compose up -d` and `podman-compose up -d` unchanged.
services:
  postgres:
    # pgvector pre-installed. The extension is not in Arch's repos, so a native
    # Postgres would mean compiling it from source.
    image: docker.io/pgvector/pgvector:pg18
    container_name: amos-postgres
    environment:
      POSTGRES_USER: amos
      POSTGRES_PASSWORD: amos
      POSTGRES_DB: amos
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images changed this convention: the mount goes at
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. The image places data
      # in a version-named subdirectory so `pg_upgrade --link` can work across a
      # single mount boundary. Using the old path makes the container exit(1).
      - amos-pgdata:/var/lib/postgresql
    healthcheck:
      # Without this, the app starts before Postgres accepts connections and
      # fails on its first query rather than waiting.
      test: ["CMD-SHELL", "pg_isready -U amos -d amos"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional. Only needed when AMOS_OTLP_ENDPOINT is set; the app runs fine
  # without it, and every span becomes a no-op. Deliberately a local collector
  # rather than a SaaS: nothing about a single-user project justifies shipping
  # traces to a vendor.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: amos-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro,Z
    ports:
      - "4318:4318"   # OTLP/HTTP
    profiles: ["observability"]

  # Web search for the researcher (V1.9, ADR-018). A metasearch engine run
  # locally, so web_search needs no key and no account. Pinned to a build two
  # weeks old on the day it was chosen; bound to localhost only.
  # Start it with `make web-up`.
  searxng:
    image: docker.io/searxng/searxng:2026.11.6-ac11e14c5
    container_name: amos-searxng
    environment:
      # Used for SearXNG's own cryptography. Set your own in .env for anything
      # beyond one machine.
      SEARXNG_SECRET: "${SEARXNG_SECRET:-amos-local-searxng-only}"
      SEARXNG_BASE_URL: "http://127.0.0.1:8888/"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro,Z
    ports:
      - "127.0.0.1:8888:8080"
    profiles: ["web"]

volumes:
  amos-pgdata:
