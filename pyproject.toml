[project]
name = "amos"
version = "0.4.0"
description = "Autonomous Multi-Agent Operating System"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.119.1",        # 0.119.1 is the floor: earlier versions break on Python 3.14
    "pydantic>=2.12",          # 2.12 added Python 3.14 support
    "pydantic-settings>=2.7",
    "google-genai>=2.21.0",    # google-generativeai is deprecated
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",             # required by fastapi.testclient
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amos"]

# src/ layout: editable installs need this explicitly, or `python -m amos`
# fails with ModuleNotFoundError even though pip reports it installed.
[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real Gemini API; skipped unless AMOS_RUN_LIVE_TESTS=1",
    "db: needs a running PostgreSQL; skipped automatically when unreachable",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
