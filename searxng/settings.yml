# SearXNG for AMOS's web_search tool (ADR-018). Everything not set here comes from
# SearXNG's own defaults (use_default_settings), read from docs.searxng.org on
# 2026-11-21.
use_default_settings: true

server:
  # Overridden by $SEARXNG_SECRET from compose.yaml; never the shipped default.
  secret_key: "set-by-environment"
  # A private instance on 127.0.0.1: no bot limiter (it needs a valkey database),
  # no image proxy, not advertised as public.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # JSON is what the tool reads. Without it the API answers 403 Forbidden.
  formats:
    - html
    - json
  safe_search: 1

# More than one upstream engine (V1.10). The first measurement found every
# result coming from one engine; a day of testing then got it suspended for
# "too many requests" and searches came back empty. Spreading queries across
# several engines means one being blocked no longer empties the results.
engines:
  # Probed from this machine on 2026-11-21: bing 10 results, privacywall 10;
  # google and qwant "access denied", duckduckgo CAPTCHA — so not enabled.
  - name: bing
    disabled: false
  - name: privacywall
    disabled: false
