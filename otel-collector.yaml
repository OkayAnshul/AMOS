# Minimal OpenTelemetry collector: accept OTLP, print to the log.
#
# Deliberately no backend. The point of V0.9 is that AMOS emits correct,
# well-shaped telemetry — where it is stored is a deployment decision, and
# standing up Jaeger/Tempo/Prometheus for a single-user project would be exactly
# the "massive observability stack" the roadmap warns against.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
